<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>The Chamber of Shared Spells</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cinzel+Decorative:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    position: fixed;
}

body {
    background: radial-gradient(ellipse at 50% 42%, #1a0d26 0%, #0c0512 38%, #040206 72%, #010002 100%);
    color: #e7d4a2;
    font-family: "Cormorant Garamond", serif;
}

/* Welcome Overlay */
.welcome-overlay {
    position: fixed;
    inset: 0;
    z-index: 10000;
    background: radial-gradient(ellipse at center, rgba(16, 8, 23, 0.96) 0%, rgba(2, 1, 3, 0.98) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: opacity 0.8s ease, visibility 0.8s ease;
    padding: 20px;
    touch-action: manipulation;
}

.welcome-overlay.fade-out {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.welcome-box {
    text-align: center;
    max-width: 400px;
    width: 100%;
    padding: 35px 25px;
    background: linear-gradient(145deg, #17100b 0%, #2b180d 50%, #120b08 100%);
    border: 2px solid rgba(212, 180, 106, 0.4);
    border-radius: 12px;
    box-shadow: 0 0 40px rgba(0, 0, 0, 0.9), inset 0 0 20px rgba(207, 164, 74, 0.15);
}

.welcome-symbol {
    font-family: "Cinzel Decorative", serif;
    font-size: 26px;
    color: #cda85b;
    margin-bottom: 12px;
}

.welcome-title {
    font-family: "Cinzel Decorative", "Cinzel", serif;
    font-size: 22px;
    letter-spacing: 1px;
    color: #d4b46a;
    margin-bottom: 12px;
    text-shadow: 1px 1px 0 #5d421d;
}

.welcome-text {
    font-family: "Cormorant Garamond", serif;
    font-size: 18px;
    line-height: 1.5;
    color: #e7d4a2;
}

.welcome-text strong {
    color: #f7e0a8;
    font-style: italic;
}

/* Info Navigation Button */
.info-btn {
    position: absolute;
    top: 20px;
    right: 20px;
    background: linear-gradient(135deg, #382512 0%, #1f1309 100%);
    border: 1px solid #d4b46a;
    color: #f1dfbd;
    font-family: "Cinzel", serif;
    font-size: 15px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 3px 8px rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 600;
}

.info-btn:active {
    transform: scale(0.92);
}

/* Info Instructions Modal */
.info-modal {
    position: fixed;
    inset: 0;
    z-index: 10001;
    background: rgba(10, 5, 15, 0.88);
    backdrop-filter: blur(5px);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s ease, visibility 0.3s ease;
    padding: 20px;
}

.info-modal.active {
    opacity: 1;
    visibility: visible;
}

.info-modal-content {
    background: linear-gradient(145deg, #17100b 0%, #2b180d 50%, #120b08 100%);
    border: 2px solid rgba(212, 180, 106, 0.5);
    border-radius: 12px;
    padding: 25px 20px;
    max-width: 340px;
    width: 100%;
    box-shadow: 0 0 40px rgba(0,0,0,0.9), inset 0 0 15px rgba(207, 164, 74, 0.1);
    color: #e7d4a2;
    position: relative;
}

.info-modal-close {
    position: absolute;
    top: 12px;
    right: 15px;
    background: none;
    border: none;
    color: #d4b46a;
    font-size: 18px;
    cursor: pointer;
}

.info-modal-title {
    font-family: "Cinzel Decorative", serif;
    font-size: 17px;
    color: #d4b46a;
    margin-bottom: 12px;
    text-align: center;
    text-shadow: 1px 1px 0 #5d421d;
}

.info-list {
    font-family: "Cormorant Garamond", serif;
    font-size: 14.5px;
    line-height: 1.45;
    padding-left: 18px;
    color: #e7d4a2;
}

.info-list li {
    margin-bottom: 8px;
}

.info-list strong {
    color: #f7e0a8;
}

/* Main Stage */
.stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    perspective: 1400px;
    overflow: hidden;
}

/* Atmosphere Elements */
.magic-glow {
    position: absolute;
    width: 450px;
    height: 450px;
    left: 50%;
    top: 45%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(130, 75, 190, 0.12) 0%, transparent 70%);
    filter: blur(10px);
    pointer-events: none;
}

.candle-light {
    position: absolute;
    width: 350px;
    height: 350px;
    left: 50%;
    top: 45%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 183, 75, 0.09) 0%, transparent 70%);
    filter: blur(10px);
    pointer-events: none;
}

.floor-shadow {
    position: absolute;
    width: 320px;
    height: 80px;
    left: 50%;
    top: calc(50% + 220px);
    transform: translateX(-50%) rotateX(70deg);
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(0, 0, 0, 0.8), transparent 70%);
    filter: blur(10px);
    pointer-events: none;
}

.dust {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 100;
}

.dust-particle {
    position: absolute;
    width: 2px;
    height: 2px;
    border-radius: 50%;
    background: rgba(214, 181, 115, 0.5);
    animation: dustFloat linear infinite;
}

@keyframes dustFloat {
    from { transform: translateY(20px); opacity: 0; }
    50% { opacity: 0.7; }
    to { transform: translateY(-100vh); opacity: 0; }
}

@keyframes textFadeIn {
    0% { opacity: 0; transform: translateY(8px); }
    100% { opacity: 1; transform: translateY(0); }
}

.fade-text {
    animation: textFadeIn 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
}

/* Book Container & Scene */
.book-container-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
    z-index: 10;
}

.book-scene {
    position: relative;
    width: calc(var(--book-w) + 40px);
    height: calc(var(--book-h) + 20px);
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 1400px;
    overflow: visible;
    user-select: none;
    touch-action: none;
}

/* Zoom Wrapper for Pinch-Zoom & Drag Pan */
.zoom-wrapper {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    transform-origin: center center;
    will-change: transform;
}

/* Control Panel */
.control-panel {
    display: flex;
    align-items: center;
    gap: 15px;
    background: rgba(18, 10, 26, 0.9);
    border: 1px solid rgba(212, 180, 106, 0.4);
    padding: 8px 18px;
    border-radius: 30px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(8px);
    z-index: 500;
}

.nav-btn {
    background: linear-gradient(135deg, #382512 0%, #1f1309 100%);
    border: 1px solid #d4b46a;
    color: #f1dfbd;
